[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reserve-juggler"
version = "1.0.0"
description = "Autonomous Liquidity Management & Treasury Intelligence Platform"
readme = "docs/part3.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
test = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration", "tests/regression"]
addopts = "-v -p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["src"]
