[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reserve-juggler"
version = "0.1.0"
description = "Quantitative treasury liquidity management, simulation, and hybrid forecasting platform"
authors = [{name = "Reserve Juggler Team 1"}]
readme = "docs/part1.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
